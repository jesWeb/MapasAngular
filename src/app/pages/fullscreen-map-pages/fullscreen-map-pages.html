<div #map></div>

<section id="controls">
  <h2 class="text-2xl font-bold text-black mb-2">
    Zoom
    <small class="text-gray-500 font-normal">{{
      Zoom() | number : "1.0-0"
    }}</small>
  </h2>

  <input
    type="range"
    min="0"
    max="20"
    [value]="Zoom()"
    (input)="Zoom.set(+txtZoom.value)"
    #txtZoom
    class="range range-warning"
  />

  <h2 class="text-2xl font-bold text-black">Coordenadas</h2>
  <pre class="text-sem text-slate-700 font-semibold">
    {{
      {
        latitud: cordenadas().lat | number : "1.3-3",
        longitud: cordenadas().lng | number : "1.3-3"
      } | json
    }}
  </pre>
</section>
